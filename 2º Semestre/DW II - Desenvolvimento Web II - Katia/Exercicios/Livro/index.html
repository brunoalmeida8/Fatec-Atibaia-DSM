<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livros</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>

<body>
    <header>
        <nav>
            <button>Carrinho</button>
        </nav>
    </header>

    <main>
        <section class="estante">
            <!-- Livro 1 -->
            <div class="livros">
                <img src="img/Dom casmurro.jpg" alt="">
                <h2>Dom Casmurro</h2>
                <p>Autor: Machado de Assis</p>
                <p>Preço: R$ 29,90</p>
                <button type="button">Adicionar</button>
            </div>

            <!-- Livro 2 -->
            <div class="livros">
                <img src="img/O alquimista.jpg" alt="">
                <h2>O Alquimista</h2>
                <p>Autor: Paulo Coelho</p>
                <p>Preço: R$ 34,90</p>
                <button type="button">Adicionar</button>
            </div>

            <!-- Livro 3 -->
            <div class="livros">
                <img src="img/Memórias Póstumas de Brás Cubas.png" alt="">
                <h2>Memórias Póstumas de Brás Cubas</h2>
                <p>Autor: Machado de Assis</p>
                <p>Preço: R$ 24,90</p>
                <button type="button">Adicionar</button>
            </div>

            <!-- Livro 4 -->
            <div class="livros">
                <img src="img/Grande Sertão - Veredas.jpg" alt="">
                <h2>Grande Sertão: Veredas</h2>
                <p>Autor: João Guimarães Rosa</p>
                <p>Preço: R$ 49,90</p>
                <button type="button">Adicionar</button>
            </div>
        </section>
    </main>
</body>

</html>
