<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" width="100%" height="100%" style="background-color: #f2eae1; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
  
  <!-- BARRA DE NAVEGAÇÃO (NAVBAR) -->
  <rect x="0" y="0" width="1000" height="75" fill="#eadccb" stroke="#d5c4b1" stroke-width="1"/>
  <rect x="0" y="0" width="1000" height="4" fill="#c4601a"/>
  
  <!-- Logo Negra Visão (Espiral + Texto) -->
  <g transform="translate(35, 18)">
    <!-- Espiral estilizada -->
    <path d="M 20 20 C 10 10, 5 25, 18 32 C 28 36, 35 20, 22 10 C 12 2, 0 18, 10 32 C 18 42, 38 38, 40 22" fill="none" stroke="#1c5235" stroke-width="4" stroke-linecap="round"/>
    <circle cx="12" cy="10" r="3" fill="#c4601a"/>
    <circle cx="32" cy="12" r="2.5" fill="#eab308"/>
    <circle cx="36" cy="28" r="2.5" fill="#dc2626"/>
    <!-- Texto do Logo -->
    <text x="55" y="28" fill="#1a1a1a" font-size="20" font-weight="bold">Negra visão</text>
  </g>

  <!-- Links de Navegação -->
  <g fill="#735a45" font-size="14" font-weight="600">
    <text x="480" y="44">Home</text>
    <text x="545" y="44">Cadastro de Responsáveis</text>
    <text x="740" y="44">Eventos Cadastrados</text>
    <text x="895" y="44">Relatório</text>
  </g>

  <!-- CONTAINER PRINCIPAL (CARD DO FORMULÁRIO) -->
  <rect x="120" y="105" width="760" height="760" rx="12" fill="#faf6f0" stroke="#e0d2c1" stroke-width="1.5"/>

  <!-- TÍTULO DA TELA -->
  <text x="150" y="150" fill="#8e4413" font-size="22" font-weight="bold">3. Cadastrar Evento</text>
  <line x1="150" y1="165" x2="850" y2="165" stroke="#c4601a" stroke-width="2"/>

  <!-- LINHA 1: Nome do Evento + Responsável -->
  <!-- Nome do Evento -->
  <text x="150" y="200" fill="#2b2520" font-size="14" font-weight="bold">Nome do Evento *</text>
  <rect x="150" y="208" width="330" height="42" rx="5" fill="#ffffff" stroke="#a89a8b" stroke-width="1.5"/>
  <text x="162" y="234" fill="#1a1a1a" font-size="14">Capoeira Angola</text>

  <!-- Responsável -->
  <text x="510" y="200" fill="#2b2520" font-size="14" font-weight="bold">Responsável *</text>
  <rect x="510" y="208" width="340" height="42" rx="5" fill="#ffffff" stroke="#a89a8b" stroke-width="1.5"/>
  <text x="522" y="234" fill="#1a1a1a" font-size="14">Mestre Ramos</text>
  <polygon points="830,224 840,224 835,232" fill="#55483d"/>

  <!-- LINHA 2: Descrição -->
  <text x="150" y="280" fill="#2b2520" font-size="14" font-weight="bold">Descrição do Evento</text>
  <rect x="150" y="288" width="700" height="50" rx="5" fill="#ffffff" stroke="#a89a8b" stroke-width="1.5"/>
  <text x="162" y="318" fill="#786c60" font-size="14">Aulas práticas de capoeira focadas na valorização da cultura afro-brasileira...</text>

  <!-- LINHA 3: Data Início + Horário -->
  <!-- Data Início -->
  <text x="150" y="368" fill="#2b2520" font-size="14" font-weight="bold">Data Início *</text>
  <rect x="150" y="376" width="330" height="42" rx="5" fill="#ffffff" stroke="#a89a8b" stroke-width="1.5"/>
  <text x="162" y="402" fill="#1a1a1a" font-size="14">21/10/2026</text>
  <!-- Ícone Calendário -->
  <g transform="translate(450, 388)" fill="none" stroke="#66584c" stroke-width="2">
    <rect x="0" y="0" width="16" height="16" rx="2"/>
    <line x1="0" y1="5" x2="16" y2="5"/>
  </g>

  <!-- Horário -->
  <text x="510" y="368" fill="#2b2520" font-size="14" font-weight="bold">Horário *</text>
  <rect x="510" y="376" width="340" height="42" rx="5" fill="#ffffff" stroke="#a89a8b" stroke-width="1.5"/>
  <text x="522" y="402" fill="#1a1a1a" font-size="14">16:30 às 18:00</text>
  <!-- Ícone Relógio -->
  <g transform="translate(820, 388)" fill="none" stroke="#66584c" stroke-width="2">
    <circle cx="8" cy="8" r="8"/>
    <polyline points="8,3 8,8 12,8"/>
  </g>

  <!-- LINHA 4: Prazo Fim Inscrição (Opcional) + Capacidade -->
  <!-- Data Fim Inscrição -->
  <text x="150" y="448" fill="#2b2520" font-size="14" font-weight="bold">Data Fim Inscrição (Opcional)</text>
  <rect x="150" y="456" width="330" height="42" rx="5" fill="#ffffff" stroke="#a89a8b" stroke-width="1.5"/>
  <text x="162" y="482" fill="#9c8e80" font-size="14">dd/mm/aaaa</text>
  <text x="150" y="513" fill="#8a6d53" font-size="11" font-style="italic">* Deixe em branco caso as inscrições fiquem abertas continuamente.</text>

  <!-- Capacidade de Vagas -->
  <text x="510" y="448" fill="#2b2520" font-size="14" font-weight="bold">Capacidade de Vagas *</text>
  <rect x="510" y="456" width="340" height="42" rx="5" fill="#ffffff" stroke="#a89a8b" stroke-width="1.5"/>
  <text x="522" y="482" fill="#1a1a1a" font-size="14">40</text>

  <!-- PAINEL DE RECORRÊNCIA E FREQUÊNCIA -->
  <rect x="150" y="535" width="700" height="200" rx="8" fill="#f0e5d8" stroke="#d5c2ae" stroke-width="1.5"/>

  <!-- Título e Radios -->
  <text x="170" y="565" fill="#2b2520" font-size="14" font-weight="bold">Recorrência *</text>
  
  <circle cx="280" cy="560" r="7" fill="#ffffff" stroke="#a89a8b" stroke-width="2"/>
  <text x="295" y="565" fill="#4a3e35" font-size="14">Única</text>

  <circle cx="370" cy="560" r="7" fill="#ffffff" stroke="#c4601a" stroke-width="2"/>
  <circle cx="370" cy="560" r="3.5" fill="#c4601a"/>
  <text x="385" y="565" fill="#1a1a1a" font-size="14" font-weight="bold">Recorrente</text>

  <!-- Campo Intervalo + Frequência -->
  <text x="170" y="612" fill="#2b2520" font-size="14" font-weight="bold">Intervalo (Repetir a cada) *</text>
  <rect x="350" y="592" width="60" height="38" rx="5" fill="#ffffff" stroke="#a89a8b" stroke-width="1.5"/>
  <text x="373" y="616" fill="#1a1a1a" font-size="14" font-weight="bold">2</text>

  <text x="430" y="612" fill="#2b2520" font-size="14" font-weight="bold">Frequência *</text>
  <rect x="520" y="592" width="180" height="38" rx="5" fill="#ffffff" stroke="#a89a8b" stroke-width="1.5"/>
  <text x="532" y="616" fill="#1a1a1a" font-size="14">Semana(s)</text>
  <polygon points="680,608 690,608 685,616" fill="#55483d"/>

  <text x="710" y="616" fill="#786c60" font-size="12" font-style="italic">(A cada 2 semanas)</text>

  <!-- Checkboxes dos Dias da Semana -->
  <text x="170" y="665" fill="#2b2520" font-size="14" font-weight="bold">Dias da Semana:</text>
  
  <!-- Seg -->
  <rect x="290" y="652" width="18" height="18" rx="3" fill="#ffffff" stroke="#a89a8b"/>
  <text x="313" y="666" fill="#4a3e35" font-size="13">Seg</text>

  <!-- Ter (Marcado) -->
  <rect x="360" y="652" width="18" height="18" rx="3" fill="#1c5235" stroke="#1c5235"/>
  <path d="M 363 661 L 368 666 L 375 655" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text x="383" y="666" fill="#1a1a1a" font-size="13" font-weight="bold">Ter</text>

  <!-- Qua -->
  <rect x="430" y="652" width="18" height="18" rx="3" fill="#ffffff" stroke="#a89a8b"/>
  <text x="453" y="666" fill="#4a3e35" font-size="13">Qua</text>

  <!-- Qui (Marcado) -->
  <rect x="500" y="652" width="18" height="18" rx="3" fill="#1c5235" stroke="#1c5235"/>
  <path d="M 503 661 L 508 666 L 515 655" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text x="523" y="666" fill="#1a1a1a" font-size="13" font-weight="bold">Qui</text>

  <!-- Sex -->
  <rect x="570" y="652" width="18" height="18" rx="3" fill="#ffffff" stroke="#a89a8b"/>
  <text x="593" y="666" fill="#4a3e35" font-size="13">Sex</text>

  <!-- Sáb -->
  <rect x="640" y="652" width="18" height="18" rx="3" fill="#ffffff" stroke="#a89a8b"/>
  <text x="663" y="666" fill="#4a3e35" font-size="13">Sáb</text>

  <!-- Dom -->
  <rect x="710" y="652" width="18" height="18" rx="3" fill="#ffffff" stroke="#a89a8b"/>
  <text x="733" y="666" fill="#4a3e35" font-size="13">Dom</text>

  <!-- BOTÃO SALVAR EVENTO (VERDE ESCURO DO PROJETO) -->
  <rect x="150" y="760" width="180" height="46" rx="6" fill="#1c5235"/>
  <text x="185" y="789" fill="#ffffff" font-size="15" font-weight="bold">Salvar Evento</text>

</svg>
