<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="100%" height="100%" style="background-color: #f2eae1; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
  
  <!-- NAVBAR -->
  <rect x="0" y="0" width="900" height="70" fill="#eadccb" stroke="#d5c4b1" stroke-width="1"/>
  <rect x="0" y="0" width="900" height="4" fill="#c4601a"/>
  
  <g transform="translate(30, 15)">
    <path d="M 20 20 C 10 10, 5 25, 18 32 C 28 36, 35 20, 22 10 C 12 2, 0 18, 10 32 C 18 42, 38 38, 40 22" fill="none" stroke="#1c5235" stroke-width="4" stroke-linecap="round"/>
    <circle cx="12" cy="10" r="3" fill="#c4601a"/>
    <circle cx="32" cy="12" r="2.5" fill="#eab308"/>
    <circle cx="36" cy="28" r="2.5" fill="#dc2626"/>
    <text x="55" y="28" fill="#1a1a1a" font-size="20" font-weight="bold">Negra visão</text>
  </g>

  <g fill="#735a45" font-size="14" font-weight="600">
    <text x="560" y="42">Módulo Acadêmico</text>
    <text x="720" y="42">Validar Presença</text>
  </g>

  <!-- CONTAINER PRINCIPAL -->
  <rect x="40" y="85" width="820" height="505" rx="8" fill="#faf6f0" stroke="#e0d2c1" stroke-width="1.5"/>
  <text x="65" y="120" fill="#8e4413" font-size="18" font-weight="bold">Validar Presença</text>
  <line x1="65" y1="130" x2="835" y2="130" stroke="#c4601a" stroke-width="1.5"/>

  <!-- 1. PESQUISA DO ALUNO -->
  <text x="65" y="155" fill="#2b2520" font-size="12" font-weight="bold">1. Pesquisar Aluno (CPF ou Nome) *</text>
  <rect x="65" y="163" width="340" height="36" rx="4" fill="#ffffff" stroke="#a89a8b" stroke-width="1.2"/>
  <text x="75" y="186" fill="#1a1a1a" font-size="13">314.582.901-22 (Carlos Eduardo)</text>

  <rect x="415" y="163" width="105" height="36" rx="4" fill="#1c5235"/>
  <text x="439" y="186" fill="#ffffff" font-size="12" font-weight="bold">Localizar</text>

  <!-- 2. SELECIONAR O EVENTO DO ALUNO -->
  <text x="65" y="225" fill="#2b2520" font-size="12" font-weight="bold">2. Selecionar o Evento Inscrito *</text>
  <rect x="65" y="233" width="455" height="36" rx="4" fill="#ffffff" stroke="#a89a8b" stroke-width="1.2"/>
  <text x="75" y="256" fill="#1a1a1a" font-size="13">Capoeira Angola (Recorrente - Seg/Qui)</text>
  <path d="M 493 246 L 498 253 L 503 246" fill="none" stroke="#735a45" stroke-width="2"/>

  <!-- 3. SELECIONAR A SESSÃO / DATA ESPECÍFICA -->
  <text x="65" y="295" fill="#2b2520" font-size="12" font-weight="bold">3. Selecionar a Sessão / Data Pendente de Presença *</text>
  <rect x="65" y="303" width="550" height="36" rx="4" fill="#ffffff" stroke="#a89a8b" stroke-width="1.2"/>
  <text x="75" y="326" fill="#1a1a1a" font-size="13">05/10/2026 (Segunda-feira) - 16:00 [Aula de Hoje]</text>
  <path d="M 588 316 L 593 323 L 598 316" fill="none" stroke="#735a45" stroke-width="2"/>

  <!-- 4. PAINEL DE CONFIRMAÇÃO FINAL -->
  <rect x="65" y="360" width="770" height="155" rx="6" fill="#f2e8dc" stroke="#d5c2ae" stroke-width="1.2"/>
  
  <text x="90" y="388" fill="#735a45" font-size="11" font-weight="bold" letter-spacing="1">CONFIRMAÇÃO DE REGISTRO DE FREQUÊNCIA</text>

  <text x="90" y="415" fill="#55483d" font-size="13">Aluno:</text>
  <text x="145" y="415" fill="#1a1a1a" font-size="14" font-weight="bold">Carlos Eduardo Silva</text>

  <text x="480" y="415" fill="#55483d" font-size="13">Status Matrícula:</text>
  <rect x="590" y="400" width="65" height="22" rx="4" fill="#dcfce7" stroke="#166534"/>
  <text x="602" y="415" fill="#166534" font-size="11" font-weight="bold">ATIVO</text>

  <text x="90" y="450" fill="#55483d" font-size="13">Evento / Sessão:</text>
  <text x="210" y="450" fill="#1a1a1a" font-size="13">Capoeira Angola - 05/10/2026 às 16:00</text>

  <!-- Botão para Salvar a Presença daquela Sessão Específica -->
  <rect x="580" y="438" width="225" height="38" rx="4" fill="#1c5235"/>
  <text x="612" y="462" fill="#ffffff" font-size="13" font-weight="bold">Salvar Presença na Sessão</text>

</svg>
