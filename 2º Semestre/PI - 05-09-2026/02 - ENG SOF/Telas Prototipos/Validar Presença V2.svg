  <circle cx="680" cy="299" r="6" fill="#1c5235" stroke="#1c5235" stroke-width="2"/>
  <circle cx="680" cy="299" r="2" fill="#ffffff"/>
  <text x="692" y="303" fill="#1a1a1a" font-size="11" font-weight="bold">Presente</text>
  
  <circle cx="760" cy="299" r="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="772" y="303" fill="#4b5563" font-size="11">Ausente</text>

  <!-- Aluno 2 -->
  <rect x="65" y="318" width="770" height="38" fill="#fdfbf7" stroke="#f0e6d9" stroke-width="1"/>
  <text x="80" y="342" fill="#1a1a1a" font-size="12">219.840.112-09</text>
  <text x="220" y="342" fill="#1a1a1a" font-size="12" font-weight="bold">Mariana Oliveira Santos</text>
  <text x="520" y="342" fill="#166534" font-size="12" font-weight="bold">Pendente</text>
  
  <circle cx="680" cy="337" r="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="692" y="341" fill="#4b5563" font-size="11">Presente</text>
  
  <circle cx="760" cy="337" r="6" fill="#991b1b" stroke="#991b1b" stroke-width="2"/>
  <circle cx="760" cy="337" r="2" fill="#ffffff"/>
  <text x="772" y="341" fill="#991b1b" font-size="11" font-weight="bold">Ausente</text>

  <!-- Aluno 3 -->
  <rect x="65" y="356" width="770" height="38" fill="#ffffff" stroke="#f0e6d9" stroke-width="1"/>
  <text x="80" y="380" fill="#1a1a1a" font-size="12">402.918.331-54</text>
  <text x="220" y="380" fill="#1a1a1a" font-size="12" font-weight="bold">Thiago Souza Pereira</text>
  <text x="520" y="380" fill="#166534" font-size="12" font-weight="bold">Pendente</text>
  
  <circle cx="680" cy="375" r="6" fill="#1c5235" stroke="#1c5235" stroke-width="2"/>
  <circle cx="680" cy="375" r="2" fill="#ffffff"/>
  <text x="692" y="379" fill="#1a1a1a" font-size="11" font-weight="bold">Presente</text>
  
  <circle cx="760" cy="375" r="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="772" y="379" fill="#4b5563" font-size="11">Ausente</text>

  <!-- BOTÕES DE AÇÃO -->
  <rect x="65" y="455" width="180" height="42" rx="5" fill="#1c5235"/>
  <text x="95" y="481" fill="#ffffff" font-size="13" font-weight="bold">Salvar Frequência</text>

  <rect x="260" y="455" width="130" height="42" rx="5" fill="#d1d5db"/>
