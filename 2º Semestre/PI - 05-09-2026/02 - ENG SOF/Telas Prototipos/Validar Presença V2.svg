  <line x1="65" y1="128" x2="835" y2="128" stroke="#c4601a" stroke-width="1.5"/>

  <!-- ÁREA DE FILTROS CASCATA (Evento -> Data -> Horário) -->
  <!-- 1. Evento -->
  <text x="65" y="153" fill="#2b2520" font-size="11" font-weight="bold">1. Selecione o Evento *</text>
  <rect x="65" y="160" width="230" height="36" rx="4" fill="#ffffff" stroke="#a89a8b" stroke-width="1.2"/>
  <text x="75" y="183" fill="#1a1a1a" font-size="12">Capoeira Angola</text>
  <path d="M 278 175 L 283 182 L 288 175" fill="none" stroke="#735a45" stroke-width="2"/>

  <!-- 2. Data -->
  <text x="310" y="153" fill="#2b2520" font-size="11" font-weight="bold">2. Data da Sessão *</text>
  <rect x="310" y="160" width="200" height="36" rx="4" fill="#ffffff" stroke="#a89a8b" stroke-width="1.2"/>
  <text x="320" y="183" fill="#1a1a1a" font-size="12">10/10/2026 (Segunda)</text>
  <path d="M 493 175 L 498 182 L 503 175" fill="none" stroke="#735a45" stroke-width="2"/>

  <!-- 3. Horário -->
  <text x="525" y="153" fill="#2b2520" font-size="11" font-weight="bold">3. Horário do Dia *</text>
  <rect x="525" y="160" width="150" height="36" rx="4" fill="#ffffff" stroke="#a89a8b" stroke-width="1.2"/>
  <text x="535" y="183" fill="#1a1a1a" font-size="12">16:00 às 17:30</text>
  <path d="M 658 175 L 663 182 L 668 175" fill="none" stroke="#735a45" stroke-width="2"/>

  <!-- Botão Buscar Lista -->
  <rect x="690" y="160" width="145" height="36" rx="4" fill="#1c5235"/>
  <text x="712" y="183" fill="#ffffff" font-size="12" font-weight="bold">Buscar Chamada</text>

  <!-- DIVISÓRIA -->
  <line x1="65" y1="212" x2="835" y2="212" stroke="#e0d2c1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- TÍTULO DA LISTA GERADA -->
  <text x="65" y="233" fill="#1c5235" font-size="13" font-weight="bold">Sessão Selecionada: Capoeira Angola — Dia 10/10/2026 às 16:00 (15 Alunos Inscritos)</text>

  <!-- TABELA DE PRESENÇA -->
  <!-- Cabeçalho -->
  <rect x="65" y="248" width="770" height="32" fill="#735a45"/>
