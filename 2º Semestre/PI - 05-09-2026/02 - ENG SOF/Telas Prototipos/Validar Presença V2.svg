<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="100%" height="100%" style="background-color: #f2eae1; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
  
  <!-- NAVBAR -->
  <rect x="0" y="0" width="900" height="70" fill="#eadccb" stroke="#d5c4b1" stroke-width="1"/>
  <rect x="0" y="0" width="900" height="4" fill="#c4601a"/>
  
  <g transform="translate(30, 15)">
    <path d="M 20 20 C 10 10, 5 25, 18 32 C 28 36, 35 20, 22 10 C 12 2, 0 18, 10 32 C 18 42, 38 38, 40 22" fill="none" stroke="#1c5235" stroke-width="4" stroke-linecap="round"/>
    <circle cx="12" cy="10" r="3" fill="#c4601a"/>
    <circle cx="32" cy="12" r="2.5" fill="#eab308"/>
    <circle cx="36" cy="28" r="2.5" fill="#dc2626"/>
    <text x="55" y="28" fill="#1a1a1a" font-size="20" font-weight="bold">Negra visão</text>
  </g>

  <g fill="#735a45" font-size="14" font-weight="600">
    <text x="560" y="42">Módulo Acadêmico</text>
    <text x="720" y="42">Validar Presença</text>
  </g>

  <!-- CONTAINER PRINCIPAL -->
  <rect x="40" y="85" width="820" height="450" rx="8" fill="#faf6f0" stroke="#e0d2c1" stroke-width="1.5"/>
