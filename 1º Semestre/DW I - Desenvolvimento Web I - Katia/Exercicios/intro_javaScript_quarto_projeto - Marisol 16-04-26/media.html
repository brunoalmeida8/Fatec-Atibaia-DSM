<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcular média</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <header>
        <h1 id="titulo">Cáculo de Média</h1>
        <p id="descricao">Informe três notas e clique em calcular para ver a média</p>
    </header>
    <main>
        <section>
            <form class="campo">
                <label for="nota1">Nota 1:</label>
                <input type="number" id="nota1" placeholder="informe a nota 1">
                <label for="nota2">Nota 2:</label>
                <input type="number" id="nota2" placeholder="informe a nota 2">
                <label for="nota3">Nota 3:</label>
                <input type="number" id="nota3" placeholder="informe a nota 3">
            <input type ="button" id="btnCalcular" value="Calcular Média">
            </form>
        </section>
        <section>
            <div id="resultado"></div>
        </section>
        <footer>
            <p>Exemplo de manipulção do DOM com JavaScript.</p>
        </footer>
    </main>
    <script src="js/js/script_media.js"></script>
</body>
</html>
