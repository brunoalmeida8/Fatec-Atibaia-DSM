<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
   <!-- <link rel="stylesheet" href="css/style.css"> -->
</head>
<body>
    <header>
        <h1>Calculadora de IMC</h1>
    </header>
    <main>
        <section>
            <h2>Preencha seus dados</h2>
            <p>Informe o peso em quilos e a altura em metros, depois clique em Calcular</p>
            <div>
                <label for="altura">Altura (m):</label>
                <input id="altura" type="number" step="0.01"> <!--aceitar o intervalo de 0.1 -->
                <label for="peso">Peso (kg):</label>
                <input id="peso" type="number" step="0.1">
            </div>
            <div>
                <button id="btnCalcular" type="button">Calcular</button>
                <button id="btnLimpar" type="button">Limpar</button>
            </div>
            <div id="resultado"></div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 - Exemplo JavaScript</p>
    </footer>
    <script src="js/js/script_imc.js"></script>
</body>
</html>
