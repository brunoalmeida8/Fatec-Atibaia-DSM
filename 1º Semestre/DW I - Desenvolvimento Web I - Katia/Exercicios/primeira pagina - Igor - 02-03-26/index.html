<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Educacional</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <header>
        <h1>Portal Educacional</h1>
        <h2>Bem-vindo ao nosso site de aprendizado!</h2>
    </header>
        <h3>Cursos</h3>
        <div class="card-container">
            <div class="card">
                <img src="imagens/html logo.png">
                <p>HTML 5</p>
            </div>
            <div class="card">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d5/CSS3_logo_and_wordmark.svg/960px-CSS3_logo_and_wordmark.svg.png">
                <p>CSS</p>
            </div>
            <div class="card">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQiXhjVqtRd6tiqcsSQ7rD6VF7NxI-3VvoR0w&s">
                <p>JavaScript</p>
            </div>
        </div>

        <h3>Conheça HTML</h3>

        <div class="card-container">
            <iframe width="560" height="315" src="https://www.youtube.com/embed/jRcpVIG4Ds0?si=pkZIb5UVs2c26xsf" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>

        <form class="form-container">
            <h3>Fale conosco</h3>
            <label>Nome completo</label>
            <input type="text" placeholder="informe o nome completo">
            
            <label>E-mail</label>
            <input type="email" placeholder="informe o email">
            
            <label>Data de nascimento</label>
            <input type="date" placeholder="informe a data de nascimento">
            <button type="submit">Enviar</button>
        </form>
        
</body>
</html>
