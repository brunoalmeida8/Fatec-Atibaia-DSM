<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estética FATEC</title>
    <link rel="stylesheet" href = "css/estilo.css">
</head>
<body>
    <main>
        <header>
            <nav>
                <a href="index.html">Home</a>
                <a href="cliente.html">Cadastro de clientes</a>
                <a href="servicos.html">Serviços</a>
                <a href="agendamento.html">Agendamento</a>
            </nav>
        </header>
        <h2>Cadastro de Agendamento</h2>
        <div class="formulario">
            <form>
                <div class="campo">
                    <label>Nome:</label>
                    <input type="text" placeholder="Digite o nome do cliente">
                </div>
                <div class="campo">
                    <label>Email:</label>
                    <input type="email" placeholder="Digite o email do cliente">
                </div>
                <div class="campo">
                    <label>Serviço:</label>
                    <input type="text" placeholder="Digite o serviço desejado">
                </div>
                <div class="campo">
                    <label>Data:</label>
                    <input type="date" placeholder="Digite a data">
                </div>
                <div class="campo">
                    <label>Horario:</label>
                    <input type="time" placeholder="Digite o horario">
                </div>
                <div class="linha">
                    <button type="submit">Cadastrar</button>
                </div>
            </form>
            <h3>Serviços cadastrados</h3>
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Email</th>
                        <th>Serviço</th>
                        <th>Data</th>
                        <th>Horario</th>
                    </tr>
                </thead>
                <tbody>
                    
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
