<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estética FATEC</title>
    <link rel="stylesheet" href = "css/estilo.css">
</head>
<body>
    <main>
        <header>
            <nav>
                <a href="index.html">Home</a>
                <a href="cliente.html">Cadastro de clientes</a>
                <a href="servicos.html">Serviços</a>
                <a href="agendamento.html">Agendamento</a>
            </nav>
        </header>
        <h2>Cadastro de Serviços</h2>
        <div class="formulario">
            <form>
                <div class="campo">
                    <label>Nome:</label>
                    <input type="text" placeholder="Digite o nome do serviço">
                </div>
                <div class="campo">
                    <label>Valor:</label>
                    <input type="text" placeholder="Digite o Valor do serviço">
                </div>
                <div class="campo">
                    <label>Profissional:</label>
                    <input type="text" placeholder="Digite nome do profissional">
                </div>
                <div class="campo">
                    <label>Categoria:</label>
                    <input type="text" placeholder="Digite a Categoria">
                </div>
                <div class="linha">
                    <button type="submit">Cadastrar</button>
                </div>
            </form>
            <h3>Serviços cadastrados</h3>
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Valor</th>
                        <th>Profissional</th>
                        <th>Categoria</th>
                    </tr>
                </thead>
                <tbody>

                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
