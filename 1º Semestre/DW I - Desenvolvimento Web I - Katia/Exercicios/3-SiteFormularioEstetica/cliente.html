<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estética FATEC</title>
    <link rel="stylesheet" href = "css/estilo.css">
</head>
<body>
    <main>
        <header>
            <nav>
                <a href="index.html">Home</a>
                <a href="cliente.html">Cadastro de clientes</a>
                <a href="servicos.html">Serviços</a>
                <a href="agendamento.html">Agendamento</a>
            </nav>
        </header>
        <h2>Cadastro de cliente</h2>
        <div class="formulario">
            <form>
                <div class="campo">
                    <label>CPF:</label>
                    <input type="text">
                </div>
                <div class="campo">
                    <label>Nome:</label>
                    <input type="text">
                </div>
                <div class="campo">
                    <label>Endereço:</label>
                    <input type="text">
                </div>
                <div class="campo">
                    <label>Celular:</label>
                    <input type="tel">
                </div>
                <div class="campo">
                    <label>Data de Nacimento:</label>
                    <input type="date">
                </div>
                <div class="campo">
                    <label>Email:</label>
                    <input type="email">
                </div>
                <div class="linha">
                    <button type="submit">Cadastrar</button>
                </div>
            </form>
            <div>
                <h3>Clentes cadastrados</h3>
                <table>
                    <thead>
                        <tr>
                            <th>CPF</th>
                            <th>Nome</th>
                            <th>Endereço</th>
                            <th>Celular</th>
                            <th>Data de Nascimento</th>
                            <th>Email</th>
                        </tr>
                    </thead>
                    <tbody>

                    </tbody>
                </table>
            </div>
        </div>
    </main>
</body>
</html>
