<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estética FATEC</title>
    <link rel="stylesheet" href = "css/estilo.css">
</head>
<body>
    <main>
        <header>
            <nav>
                <a href="index.html">Home</a>
                <a href="cliente.html">Cadastro de clientes</a>
                <a href="servicos.html">Serviços</a>
                <a href="agendamento.html">Agendamento</a>
            </nav>
        </header>
      <h2>Cadastro de Clientes</h2>
    <div class="formulario">
        <form>
            <div class="campo">
                <label>CPF:</label> <!-- o que aparece antes do formuário - rótulo -->
                <INPUT type="text" placeholder="digite o CPF">
            </div>
            <div class="campo">
                <label>Nome:</label>
                <INPUT type="text" placeholder="digite o nome">
            </div>
            <div class="campo">
                <label>Endereço:</label>
                <INPUT type="text" placeholder="digite o endereço">
            </div>
            <div class="campo">
                <label>Celular:</label>
                <INPUT type="tel" placeholder="digite o telefone">
            </div>
            <div class="campo">
                <label>E-mail:</label>
                <INPUT type="email" placeholder="digite o e-mail">
            </div>
            <div class="campo">
                <label>Data de nascimento:</label>
                <INPUT type="date" placeholder="digite a data de nascimento">
            </div>
            <div class="linha">
                <button type="submit">Cadastrar</button>
            </div>
        </form>
        <div>
            <h3>Clientes cadastrados</h3>
            <table> <!-- tabela -->
                <thead>
                    <tr> <!-- trecho de uma linha -->
                        <th>CPF</th> <!-- th = cabeçalhos da colna -->
                        <th>Nome</th>
                        <th>Endereço</th>
                        <th>Celular</th>
                        <th>e-mail</th>
                        <th>Data de nascimento</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
        </div>
    </main>
</body>
</html>
