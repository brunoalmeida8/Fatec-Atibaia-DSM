<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcular Media</title>
</head>
<body>
    <header>
        <h1 id="titulo">Cálculo de Média</h1>
        <p id="descricao">Informe três notas e clique em calcular para ver a média</p>
    </header>
    <main>
        <section>
            <form>
                <label for="nota1">Nota 1:</label><!-- rotulo...for é para associar ao input-->
                <input type="number" id="nota1" placeholder="Informe a nota 1">
                <label for="nota1">Nota 2:</label>
                <input type="number" id="nota2" placeholder="Informe a nota 2">
                <label for="nota1">Nota 3:</label>
                <input type="number" id="nota3" placeholder="Informe a nota 3">
                <input type="button" id="btnCalcular" value="Calcular Média">
            </form>
        </section>
        <section>
            <div id="resultado"></div>
        </section>
        <footer>
            <p>Exemplo de maninipulação do DOM JavaScript</p><!-- dom manipulação dos objetos no documeto-->
        </footer>
    </main>
    <script src="js/script_media.js"></script><!-- para referenciar o file do javascript-->
</body>
</html>
